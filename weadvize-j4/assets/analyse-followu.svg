<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">FollowU — Analyse comparative, aujourd’hui et demain</title><desc id="desc">Aujourd’hui : IA seule, rapide et générique, humain seul, plus qualitatif mais plus lent. Demain : IA + humain, plus pertinent, plus efficace et plus rapide. Visuel FollowU sur une diapositive 16:9.</desc><defs><linearGradient id="navy" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#163a72"/><stop offset=".65" stop-color="#051637"/><stop offset="1" stop-color="#0a2859"/></linearGradient><linearGradient id="lightGold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f5e8c6"/><stop offset=".55" stop-color="#f1dc9f"/><stop offset="1" stop-color="#e9ca7c"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#071327" flood-opacity=".13"/></filter></defs><rect width="1600" height="900" fill="#fff"/><path d="M0 0H180Q73 22 0 118Z" fill="#d4a84a" opacity=".97"/><path d="M0 80Q60 9 189 -5" stroke="#ad7f1f" stroke-width="4" fill="none"/><text x="800" y="69" fill="#071a3b" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="54" text-anchor="middle">FollowU</text><line x1="489" y1="42" x2="626" y2="42" stroke="#d5ad56" stroke-width="2"/><line x1="981" y1="42" x2="1110" y2="42" stroke="#d5ad56" stroke-width="2"/><text x="800" y="109" fill="#071a3b" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="22" text-anchor="middle">Centre de formation pour entreprises</text><text x="800" y="157" fill="#071a3b" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="45" text-anchor="middle">Analyse comparative — Aujourd’hui vs Demain</text><text x="800" y="194" fill="#071a3b" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="23" text-anchor="middle">Qualité pédagogique  •  Temps de travail  •  Mode de production</text><rect x="27" y="219" width="902" height="370" rx="22" fill="#f4f4f4" stroke="none" stroke-width="1"/><rect x="965" y="219" width="615" height="370" rx="22" fill="#f4f4f4" stroke="none" stroke-width="1"/><rect x="290" y="233" width="358" height="51" rx="23" fill="url(#navy)" stroke="none" stroke-width="1"/><text x="469" y="270" fill="#fff" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="34" text-anchor="middle">Aujourd’hui</text><rect x="1129" y="233" width="286" height="51" rx="23" fill="url(#navy)" stroke="none" stroke-width="1"/><text x="1272" y="270" fill="#fff" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="34" text-anchor="middle">Demain</text><rect x="45" y="289" width="420" height="297" rx="17" fill="#ffffff" stroke="#e3e3e3" stroke-width="1" filter="url(#shadow)"/><rect x="50" y="296" width="410" height="59" rx="13" fill="#fafafa" stroke="none" stroke-width="1"/><rect x="74" y="308" width="44" height="39" rx="5" fill="none" stroke="#bd8a1e" stroke-width="3"/><text x="96" y="336" fill="#071a3b" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="20" text-anchor="middle">IA</text><line x1="96" y1="302" x2="96" y2="308" stroke="#bd8a1e" stroke-width="3"/><text x="140" y="336" fill="#071a3b" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="28">IA seule</text><circle cx="74" cy="373" r="5" fill="#be8a22"/><text x="91" y="378" fill="#071a3b" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="19">Production très rapide</text><circle cx="74" cy="403" r="5" fill="#be8a22"/><text x="91" y="408" fill="#071a3b" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="19">Base exploitable immédiatement</text><circle cx="74" cy="433" r="5" fill="#be8a22"/><text x="91" y="438" fill="#071a3b" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="19">Gain de temps au démarrage</text><circle cx="74" cy="463" r="5" fill="#be8a22"/><text x="91" y="468" fill="#071a3b" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="19">Résultat plus générique</text><circle cx="74" cy="493" r="5" fill="#be8a22"/><text x="91" y="498" fill="#071a3b" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="19">Moins de finesse pédagogique</text><rect x="52" y="528" width="406" height="46" rx="14" fill="url(#lightGold)" stroke="none" stroke-width="1"/><text x="255" y="559" fill="#071a3b" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="22" text-anchor="middle">Force : vitesse</text><rect x="481" y="289" width="438" height="297" rx="17" fill="#ffffff" stroke="#e3e3e3" stroke-width="1" filter="url(#shadow)"/><rect x="486" y="296" width="428" height="59" rx="13" fill="#fafafa" stroke="none" stroke-width="1"/><g stroke="#071a3b" fill="none" stroke-width="3"><circle cx="534" cy="323" r="11"/><path d="M513 352Q512 333 534 334Q556 334 554 352"/></g><text x="576" y="336" fill="#071a3b" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="28">Humain seul</text><circle cx="510" cy="373" r="5" fill="#be8a22"/><text x="527" y="378" fill="#071a3b" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="19">Réflexion plus approfondie</text><circle cx="510" cy="403" r="5" fill="#be8a22"/><text x="527" y="408" fill="#071a3b" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="19">Contenu plus cohérent et contextualisé</text><circle cx="510" cy="433" r="5" fill="#be8a22"/><text x="527" y="438" fill="#071a3b" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="19">Qualité perçue plus élevée</text><circle cx="510" cy="463" r="5" fill="#be8a22"/><text x="527" y="468" fill="#071a3b" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="19">Plus grande finesse pédagogique</text><circle cx="510" cy="493" r="5" fill="#be8a22"/><text x="527" y="498" fill="#071a3b" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="19">Temps de conception plus long</text><rect x="488" y="528" width="424" height="46" rx="14" fill="url(#lightGold)" stroke="none" stroke-width="1"/><text x="700" y="559" fill="#071a3b" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="22" text-anchor="middle">Force : qualité pédagogique</text><rect x="986" y="289" width="574" height="297" rx="17" fill="#ffffff" stroke="#d29a2e" stroke-width="2" filter="url(#shadow)"/><rect x="991" y="296" width="564" height="59" rx="13" fill="#fafafa" stroke="none" stroke-width="1"/><text x="1014" y="337" fill="#be8a22" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="28">IA</text><text x="1061" y="337" fill="#c59a37" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="32">+</text><g stroke="#071a3b" fill="none" stroke-width="3"><circle cx="1115" cy="320" r="9"/><path d="M1099 346Q1097 330 1115 331Q1133 331 1131 346"/></g><text x="1156" y="336" fill="#071a3b" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="28">IA + humain</text><circle cx="1015" cy="373" r="5" fill="#be8a22"/><text x="1032" y="378" fill="#071a3b" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="19">L’IA accélère la production</text><circle cx="1015" cy="403" r="5" fill="#be8a22"/><text x="1032" y="408" fill="#071a3b" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="19">L’humain apporte le sens et l’adaptation</text><circle cx="1015" cy="433" r="5" fill="#be8a22"/><text x="1032" y="438" fill="#071a3b" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="19">Résultat plus qualitatif et plus pertinent</text><circle cx="1015" cy="463" r="5" fill="#be8a22"/><text x="1032" y="468" fill="#071a3b" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="19">Meilleur équilibre rapidité / qualité</text><circle cx="1015" cy="493" r="5" fill="#be8a22"/><text x="1032" y="498" fill="#071a3b" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="19">Méthode plus efficace pour un support solide</text><rect x="993" y="528" width="560" height="46" rx="14" fill="url(#lightGold)" stroke="none" stroke-width="1"/><text x="1273" y="559" fill="#071a3b" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="22" text-anchor="middle">Force : efficacité globale</text><path d="M932 367L964 399 932 431Z" fill="#c99a36"/><rect x="27" y="632" width="1545" height="170" rx="16" fill="#fff" stroke="#cc9d40" stroke-width="1.5" filter="url(#shadow)"/><rect x="69" y="607" width="408" height="51" rx="23" fill="url(#navy)" stroke="none" stroke-width="1"/><text x="273" y="644" fill="#fff" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="34" text-anchor="middle">Ce que cela démontre</text><circle cx="145" cy="712" r="50" fill="none" stroke="#c99a36" stroke-width="5"/><circle cx="145" cy="712" r="31" fill="none" stroke="#c99a36" stroke-width="5"/><circle cx="145" cy="712" r="10" fill="#d3ac58"/><path d="M145 712l34-40 9-3" fill="none" stroke="#04163a" stroke-width="7"/><line x1="234" y1="665" x2="234" y2="768" stroke="#b88a23" stroke-width="2"/><rect x="263" y="668" width="35" height="35" rx="18" fill="#bd8b23" stroke="none" stroke-width="1"/><text x="280" y="694" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="23" text-anchor="middle">1</text><text x="315" y="694" fill="#071a3b" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="22">L’IA seule et l’humain seul ont chacun une utilité, mais leurs limites apparaissent vite.</text><rect x="263" y="711" width="35" height="35" rx="18" fill="#bd8b23" stroke="none" stroke-width="1"/><text x="280" y="737" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="23" text-anchor="middle">2</text><rect x="309" y="712" width="790" height="35" rx="5" fill="#fff1cc" stroke="none" stroke-width="1"/><text x="318" y="739" fill="#071a3b" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="23">Le meilleur modèle pour demain est hybride : IA + humain.</text><text x="262" y="779" fill="#071a3b" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="18">L’IA fait gagner du temps ; la réflexion humaine apporte la valeur pédagogique. Ensemble, elles produisent plus vite et mieux.</text><rect x="27" y="821" width="1545" height="61" rx="18" fill="#faf9f7" stroke="#e7e0d5" stroke-width="1" filter="url(#shadow)"/><text x="65" y="859" fill="#ad8429" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="28">⚡</text><text x="112" y="861" fill="#071a3b" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="18">IA seule : rapide mais plus générique</text><line x1="469" y1="835" x2="469" y2="869" stroke="#cda858" stroke-width="1.5"/><text x="486" y="860" fill="#bf9239" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="27">◯</text><text x="520" y="861" fill="#071a3b" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="17">Humain seul : très qualitatif mais plus long</text><line x1="968" y1="835" x2="968" y2="869" stroke="#cda858" stroke-width="1.5"/><text x="989" y="859" fill="#bf9239" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="23">◆</text><text x="1022" y="861" fill="#071a3b" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="17">IA + humain : plus pertinent, efficace et rapide</text><path d="M1530 900q34-32 70-53v53z" fill="#d6aa59"/></svg>